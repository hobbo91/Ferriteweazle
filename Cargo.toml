[package]
name = "ferriteweazle"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A desktop app for Greaseweazle, the floppy disk flux reader and writer"
repository = "https://github.com/hobbo91/ferriteweazle"
publish = false

[dependencies]
eframe = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
# Already built for eframe; tests/icon.rs makes the logo with it.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = true
