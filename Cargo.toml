[package]
name = "ferriteweazle"
version = "1.3.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A desktop app for Greaseweazle, the floppy disk flux reader and writer"
repository = "https://github.com/hobbo91/Ferriteweazle"
publish = false

[dependencies]
eframe = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
known-folders = "1.4"

# For build.rs; a build dependency's cfg is the building computer's.
[build-dependencies]
# Already built for the image crates; packs the bridge (build.rs).
miniz_oxide = "0.8"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

# Asks the desktop portal for light or dark. Already built for eframe's AccessKit.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
# Already built for eframe; tests/icon.rs makes the logo and the Windows icon with it.
image = { version = "0.25", default-features = false, features = ["bmp", "ico", "png"] }

[profile.release]
lto = "thin"
strip = true
